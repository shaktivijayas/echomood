apiVersion: v1
kind: ConfigMap
metadata:
  name: mood-helper-config
  namespace: mood-helper
data:
  # Database configuration
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_NAME: "mood_helper"
  DB_USER: "mood_helper"
  
  # Nextcloud configuration
  NEXTCLOUD_URL: "http://nextcloud-service:80"
  NEXTCLOUD_USERNAME: "admin"
  NEXTCLOUD_PASSWORD: "admin"
  
  # API URLs
  REACT_APP_API_URL: "http://backend-service:5000"
  REACT_APP_GEMINI_URL: "http://flask-gemini-service:5001"
  
  # Flask configuration
  FLASK_ENV: "production"
  PORT: "5001"
