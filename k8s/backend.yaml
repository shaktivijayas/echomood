apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: mood-helper
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: mood-helper-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: NODE_ENV
          value: "production"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: mood-helper-secrets
              key: JWT_SECRET
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: mood-helper-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: mood-helper-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: mood-helper-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: mood-helper-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mood-helper-secrets
              key: DB_PASSWORD
        - name: NEXTCLOUD_URL
          valueFrom:
            configMapKeyRef:
              name: mood-helper-config
              key: NEXTCLOUD_URL
        - name: NEXTCLOUD_USERNAME
          valueFrom:
            configMapKeyRef:
              name: mood-helper-config
              key: NEXTCLOUD_USERNAME
        - name: NEXTCLOUD_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: mood-helper-config
              key: NEXTCLOUD_PASSWORD
        volumeMounts:
        - name: backend-uploads
          mountPath: /app/uploads
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: backend-uploads
        persistentVolumeClaim:
          claimName: backend-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: mood-helper
spec:
  selector:
    app: backend
  ports:
  - port: 5000
    targetPort: 5000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-uploads-pvc
  namespace: mood-helper
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
