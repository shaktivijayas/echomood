apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-gemini-deployment
  namespace: mood-helper
  labels:
    app: flask-gemini
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-gemini
  template:
    metadata:
      labels:
        app: flask-gemini
    spec:
      containers:
      - name: flask-gemini
        image: mood-helper-flask-gemini:latest
        ports:
        - containerPort: 5001
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: mood-helper-secrets
              key: GEMINI_API_KEY
        - name: FLASK_ENV
          valueFrom:
            configMapKeyRef:
              name: mood-helper-config
              key: FLASK_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: mood-helper-config
              key: PORT
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: flask-gemini-service
  namespace: mood-helper
spec:
  selector:
    app: flask-gemini
  ports:
  - port: 5001
    targetPort: 5001
