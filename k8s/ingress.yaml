apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mood-helper-ingress
  namespace: mood-helper
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
  - host: mood-helper.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 5000
      - path: /gemini
        pathType: Prefix
        backend:
          service:
            name: flask-gemini-service
            port:
              number: 5001
---
# Alternative ingress for production with SSL
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mood-helper-ingress-ssl
  namespace: mood-helper
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - your-domain.com
    secretName: mood-helper-tls
  rules:
  - host: your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 5000
      - path: /gemini
        pathType: Prefix
        backend:
          service:
            name: flask-gemini-service
            port:
              number: 5001
