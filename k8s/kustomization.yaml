apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mood-helper

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - mysql.yaml
  - redis.yaml
  - backend.yaml
  - flask-gemini.yaml
  - frontend.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/name: mood-helper
  app.kubernetes.io/version: "1.0.0"
  app.kubernetes.io/component: sync-dashboard

images:
  - name: mood-helper-backend
    newTag: latest
  - name: mood-helper-flask-gemini
    newTag: latest
  - name: mood-helper-frontend
    newTag: latest
